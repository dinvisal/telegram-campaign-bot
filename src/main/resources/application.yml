server:
  port: 8080

spring:
  application:
    name: telegram-campaign-bot

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/campaign_bot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false
    show-sql: false

    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}

logging:
  level:
    com.example.campaignbot: INFO
    org.telegram.telegrambots.longpolling: DEBUG