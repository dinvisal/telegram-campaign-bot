version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: campaign-bot-db
    environment:
      POSTGRES_DB: campaign_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

volumes:
  pgdata:
