services:

  postgres:
    image: postgres:16-alpine
    container_name: campaign-bot-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: campaign_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    # Host port is bound to loopback ONLY. The app connects over the compose
    # network (jdbc:postgresql://postgres/campaign_bot), so 5432 must not be
    # exposed publicly. 127.0.0.1 keeps host-local dev/CI/psql working while
    # blocking internet access (production security fix, 2026-08-17).
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campaign_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=none

  ads-manager-reporting-bot:
    build: .

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres/campaign_bot
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

volumes:
  pgdata: